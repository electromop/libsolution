{# sidebar.html #}
<nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse shadow-sm" style="padding-left: 0; padding-right: 0;">
    <div class="row g-0">
        <!-- Минималистичный sidebar с иконками -->
        <div class="col-2 px-0 sidebar-icons" style="border-right: 1px solid #e5e5e5; background: #f8f9fa;">
            <div class="d-flex flex-column align-items-center py-3 nav-sidebar" style="height: 100vh;">
                <a class="mb-3 text-muted" href="#" title="Поиск" data-bs-toggle="modal" data-bs-target="#searchModal">
                    <i class="bi bi-search" style="font-size: 1.3rem;"></i>
                </a>
                <a class="mb-3 text-muted" href="/dashboard" title="Дэшборд" tabindex="-1">
                    <i class="bi bi-speedometer2" style="font-size: 1.3rem;"></i>
                </a>
                <a class="mb-3 text-primary" href="/substance" title="Учет">
                    <i class="bi bi-123" style="font-size: 1.3rem;"></i>
                </a>
                <a class="mb-3 text-muted" href="#" title="Протоколы" tabindex="-1" aria-disabled="true" style="filter: blur(2px); pointer-events: none;">
                    <i class="bi bi-archive" style="font-size: 1.3rem;"></i>
                </a>
                <a class="mb-3 text-muted" href="/journals" title="Журналы" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-file-text" style="font-size: 1.3rem;"></i>
                </a>
                <a class="mb-3 text-muted" href="#" title="Инвентаризация" tabindex="-1" aria-disabled="true" style="filter: blur(2px); pointer-events: none;">
                    <i class="bi bi-box" style="font-size: 1.3rem;"></i>
                </a>
                <a class="mb-3 text-muted" href="/tasks" title="Задачи" tabindex="-1">
                    <i class="bi bi-list-task" style="font-size: 1.3rem;"></i>
                </a>
                <div class="d-flex flex-column align-items-center mt-auto">
                    <button id="sidebarToggleBtn" class="btn btn-sm btn-outline-secondary mb-3" type="button" title="Свернуть сайдбар" style="border: 0;">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <a class="mb-1 text-muted mt-auto" href="/profile" title="Профиль">
                        <i class="bi bi-person-circle" style="font-size: 1.3rem;"></i>
                    </a>
                </div>
            </div>
        </div>
        <!-- Минималистичный список типов веществ -->
        <div class="col-10 pt-3 sidebar-content" style="padding-left: 10px; padding-right: 10px;">
            <h6 class="mb-3 text-secondary" style="font-size: 1.1rem; font-weight: 500;">
                <i class="bi bi-layers me-1"></i>Вещества
            </h6>
            <div class="input-group input-group-sm">
                <input type="text" id="searchInputTypes" class="form-control" placeholder="Поиск типов...">
                <button class="btn btn-outline-primary" type="button" id="searchButton">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <div class="dropdown w-100 mb-2">
                <button class="btn btn-success btn-sm w-100 mt-2" type="button" id="createTypeDropdown" data-bs-toggle="modal" data-bs-target="#typeModal">
                    Новый тип
                </button>
            </div>
            <div style="max-height: 85vh; overflow-y: auto;">
                <div id="typeList" class="list-group list-group-flush mb-3 flex-grow-1" style="border-radius: 0.5rem; min-height: 0;">
                    <!-- Список типов веществ будет рендериться через JS -->
                </div>
            </div>
        </div>
    </div>
</nav>
<script src="/static/scripts/sidebar.js"></script>
<style>
    /* Стили для сворачивания сайдбара */
    #sidebar.collapsed {
        width: 2.77%
    }
    
    #sidebar.collapsed .sidebar-icons {
        width: 100%
    }
    
    #sidebar.collapsed .sidebar-content {
        display: none;
        z-index: -1;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Инициализация сворачивания сайдбара
        initSidebarCollapse();
    });
    
    // Функция инициализации сворачивания сайдбара
    function initSidebarCollapse() {
        // Получаем ссылки на основные элементы интерфейса
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggleBtn');
        const main = document.querySelector('main');
        
        // Функция обновления иконки и заголовка кнопки переключения
        function updateToggleButton(isCollapsed) {
            if (toggleBtn) {
                const icon = toggleBtn.querySelector('i');
                if (isCollapsed) {
                    // Когда сайдбар свёрнут - показываем стрелку вправо
                    icon.className = 'bi bi-chevron-right';
                    toggleBtn.title = 'Развернуть сайдбар';
                } else {
                    // Когда сайдбар развёрнут - показываем стрелку влево
                    icon.className = 'bi bi-chevron-left';
                    toggleBtn.title = 'Свернуть сайдбар';
                }
            }
        }
        
        // Загружаем сохранённое состояние сайдбара из localStorage браузера
        const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (isCollapsed) {
            // Если сайдбар был свёрнут, применяем соответствующие стили
            sidebar.classList.add('collapsed');
            if (main) {
                // Убираем Bootstrap классы для узкого контента
                main.classList.remove('col-md-9', 'col-lg-10', 'ms-sm-auto');
                // Добавляем классы для полной ширины
                main.classList.add('col-md-12', 'col-lg-12');
                // Добавляем отступ слева равный ширине свёрнутого сайдбара (60px)
                main.style.marginLeft = '40px';
                main.style.width = 'calc(100% - 40px)';
            }
        }
        // Обновляем внешний вид кнопки в соответствии с текущим состоянием
        updateToggleButton(isCollapsed);
        
        // Назначаем обработчик события клика по кнопке переключения
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                // Проверяем текущее состояние сайдбара
                const isCurrentlyCollapsed = sidebar.classList.contains('collapsed');
                
                if (isCurrentlyCollapsed) {
                    // Разворачиваем сайдбар
                    sidebar.classList.remove('collapsed');
                    localStorage.setItem('sidebarCollapsed', 'false');
                    if (main) {
                        // Возвращаем Bootstrap классы для узкого контента
                        main.classList.remove('col-md-12', 'col-lg-12');
                        main.classList.add('col-md-9', 'col-lg-10', 'ms-sm-auto');
                        // Убираем принудительный отступ
                        main.style.marginLeft = '';
                        main.style.width = '';
                    }
                    updateToggleButton(false);
                } else {
                    // Сворачиваем сайдбар
                    sidebar.classList.add('collapsed');
                    localStorage.setItem('sidebarCollapsed', 'true');
                    if (main) {
                        // Убираем Bootstrap классы для узкого контента
                        main.classList.remove('col-md-9', 'col-lg-10', 'ms-sm-auto');
                        // Добавляем классы для полной ширины
                        main.classList.add('col-md-12', 'col-lg-12');
                        // Добавляем отступ слева для свёрнутого сайдбара
                        main.style.marginLeft = '40px';
                        main.style.width = 'calc(100% - 40px)';
                    }
                    updateToggleButton(true);
                }
            });
        }
    }
    </script>
