<script>
document.addEventListener('DOMContentLoaded', function() {
    // Инициализация сворачивания сайдбара
    initSidebarCollapse();
    
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const foldersList = document.getElementById('folders-list');
    const searchResults = document.getElementById('journals-search-results');
    const searchTitleResults = document.getElementById('journals-search-title-results');
    const searchTagResults = document.getElementById('journals-search-tag-results');
    const searchNoResults = document.getElementById('journals-search-no-results');

    function renderSearchResults(results) {
        // Очистить результаты
        searchTitleResults.innerHTML = '';
        searchTagResults.innerHTML = '';
        searchNoResults.style.display = 'none';

        let found = false;

        // Поиск по названию
        if (results.by_title && results.by_title.length > 0) {
            found = true;
            let html = '<div class="mb-2 text-secondary" style="font-size:0.97em;">По названию</div>';
            html += '<ul class="list-unstyled mb-3">';
            for (const journal of results.by_title) {
                html += `<li>
                    <a href="/journal/${journal.id}" class="folder-minimal d-block px-2 py-1">
                        <i class="bi bi-file-earmark-text me-1"></i>
                        <span class="folder-name">${journal.filename || 'Без названия'}</span>
                    </a>
                </li>`;
            }
            html += '</ul>';
            searchTitleResults.innerHTML = html;
        }

        // Поиск по тегам
        if (results.by_tags && results.by_tags.length > 0) {
            found = true;
            let html = '<div class="mb-2 text-secondary" style="font-size:0.97em;">По тегам</div>';
            html += '<ul class="list-unstyled mb-3">';
            for (const journal of results.by_tags) {
                html += `<li>
                    <a href="/journal/${journal.id}" class="folder-minimal d-block px-2 py-1">
                        <i class="bi bi-file-earmark-text me-1"></i>
                        <span class="folder-name">${journal.filename || 'Без названия'}</span>
                    </a>
                </li>`;
            }
            html += '</ul>';
            searchTagResults.innerHTML = html;
        }

        if (!found) {
            searchNoResults.style.display = '';
        }
    }

    function doSearch() {
        const query = searchInput.value.trim();
        if (query.length === 0) {
            // Показать обычный список папок
            foldersList.style.display = '';
            searchResults.style.display = 'none';
            return;
        }
        // Показать индикатор загрузки
        searchTitleResults.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm me-2"></div>Поиск...</div>';
        searchTagResults.innerHTML = '';
        searchNoResults.style.display = 'none';
        foldersList.style.display = 'none';
        searchResults.style.display = '';

        fetch(`/search?query=${encodeURIComponent(query)}`)
            .then(resp => resp.json())
            .then(results => {
                renderSearchResults(results);
            })
            .catch(() => {
                searchTitleResults.innerHTML = '';
                searchTagResults.innerHTML = '';
                searchNoResults.style.display = '';
                searchNoResults.textContent = 'Ошибка поиска';
            });
    }

    searchButton.addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            doSearch();
        }
    });
    searchInput.addEventListener('input', function() {
        if (searchInput.value.trim().length === 0) {
            foldersList.style.display = '';
            searchResults.style.display = 'none';
        }
    });
});

// Функция инициализации сворачивания сайдбара
function initSidebarCollapse() {
    // Получаем ссылки на основные элементы интерфейса
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggleBtn');
    const main = document.querySelector('main');
    
    // Функция обновления иконки и заголовка кнопки переключения
    function updateToggleButton(isCollapsed) {
        if (toggleBtn) {
            const icon = toggleBtn.querySelector('i');
            if (isCollapsed) {
                // Когда сайдбар свёрнут - показываем стрелку вправо
                icon.className = 'bi bi-chevron-right';
                toggleBtn.title = 'Развернуть сайдбар';
            } else {
                // Когда сайдбар развёрнут - показываем стрелку влево
                icon.className = 'bi bi-chevron-left';
                toggleBtn.title = 'Свернуть сайдбар';
            }
        }
    }
    
    // Загружаем сохранённое состояние сайдбара из localStorage браузера
    const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
    if (isCollapsed) {
        // Если сайдбар был свёрнут, применяем соответствующие стили
        sidebar.classList.add('collapsed');
        if (main) {
            // Убираем Bootstrap классы для узкого контента
            main.classList.remove('col-md-9', 'col-lg-10', 'ms-sm-auto');
            // Добавляем классы для полной ширины
            main.classList.add('col-md-12', 'col-lg-12');
            // Добавляем отступ слева равный ширине свёрнутого сайдбара (60px)
            main.style.marginLeft = '40px';
            main.style.width = 'calc(100% - 40px)';
        }
    }
    // Обновляем внешний вид кнопки в соответствии с текущим состоянием
    updateToggleButton(isCollapsed);
    
    // Назначаем обработчик события клика по кнопке переключения
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            // Проверяем текущее состояние сайдбара
            const isCurrentlyCollapsed = sidebar.classList.contains('collapsed');
            
            if (isCurrentlyCollapsed) {
                // Разворачиваем сайдбар
                sidebar.classList.remove('collapsed');
                localStorage.setItem('sidebarCollapsed', 'false');
                if (main) {
                    // Возвращаем Bootstrap классы для узкого контента
                    main.classList.remove('col-md-12', 'col-lg-12');
                    main.classList.add('col-md-9', 'col-lg-10', 'ms-sm-auto');
                    // Убираем принудительный отступ
                    main.style.marginLeft = '';
                    main.style.width = '';
                }
                updateToggleButton(false);
            } else {
                // Сворачиваем сайдбар
                sidebar.classList.add('collapsed');
                localStorage.setItem('sidebarCollapsed', 'true');
                if (main) {
                    // Убираем Bootstrap классы для узкого контента
                    main.classList.remove('col-md-9', 'col-lg-10', 'ms-sm-auto');
                    // Добавляем классы для полной ширины
                    main.classList.add('col-md-12', 'col-lg-12');
                    // Добавляем отступ слева для свёрнутого сайдбара
                    main.style.marginLeft = '40px';
                    main.style.width = 'calc(100% - 40px)';
                }
                updateToggleButton(true);
            }
        });
    }
}
</script>

<div class="modal fade" id="createJournalModal" tabindex="-1" aria-labelledby="createJournalModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="createJournalModalForm" autocomplete="off">
        <div class="modal-header">
          <h5 class="modal-title" id="createJournalModalLabel">Создать журнал</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>

        <div class="modal-body">

          <div class="mb-3">
            <label for="journalFolder" class="form-label">Папка</label>
            <select class="form-select" id="journalFolder" name="folder_id">
              <option value="">Без папки</option>
              <!-- Папки будут подгружаться через JS -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Создать</button>

    </div>

<script>
// --- Загрузка списка папок для выбора папки при создании журнала ---
function loadJournalFoldersSelect() {
    fetch('/api/folders')
        .then(resp => resp.json())
        .then(tree => {
            const select = document.getElementById('journalFolder');
            // Очищаем, кроме первого option
            select.innerHTML = '<option value="">Без папки</option>';
            // Собираем все папки в плоский список с уровнями
            function collectFolders(arr, level = 0) {
                let res = [];
                for (const folder of arr) {
                    // Не добавляем "Несортированные" (id == null)
                    if (folder.id !== null) {
                        res.push({id: folder.id, name: folder.name, level: level});
                    }
                    if (folder.children && folder.children.length > 0) {
                        res = res.concat(collectFolders(folder.children, level + 1));
                    }
                }
                return res;
            }
            const folders = collectFolders(tree);
            for (const folder of folders) {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = '—'.repeat(folder.level) + (folder.level > 0 ? ' ' : '') + folder.name;
                select.appendChild(option);
            }
        });
}

// Открытие модального окна — подгружаем папки
document.getElementById('createJournalBtn').addEventListener('click', function() {
    loadJournalFoldersSelect();
    // Сброс формы при открытии
    document.getElementById('createJournalModalForm').reset();
});

// Обработка отправки формы создания журнала
document.getElementById('createJournalModalForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Создание...';
    const filename = form.filename.value.trim();
    const folder_id = form.folder_id.value ? form.folder_id.value : null;
    if (!filename) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Создать';
        alert('Введите название журнала');
        return;
    }
    try {
        const formData = new FormData();
        formData.append('filename', filename);
        if (folder_id) formData.append('folder_id', folder_id);
        const resp = await fetch('/journals/create', {
            method: 'POST',
            body: formData
        });
        if (resp.redirected) {
            window.location.href = resp.url;
        } else {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Создать';
            alert('Ошибка при создании журнала');
        }
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Создать';
        alert('Ошибка сети');
    }
});
</script>

<script>
// --- Загрузка списка папок для выбора родительской папки ---
function loadParentFoldersSelect() {
    fetch('/api/folders')
        .then(resp => resp.json())
        .then(tree => {
            const select = document.getElementById('folderParent');
            // Очищаем, кроме первого option
            select.innerHTML = '<option value="">Без родительской папки</option>';
            // Собираем все папки в плоский список с уровнями
            function collectFolders(arr, level = 0) {
                let res = [];
                for (const folder of arr) {
                    // Не добавляем "Несортированные" (id == null)
                    if (folder.id !== null) {
                        res.push({id: folder.id, name: folder.name, level: level});
                    }
                    if (folder.children && folder.children.length > 0) {
                        res = res.concat(collectFolders(folder.children, level + 1));
                    }
                }
                return res;
            }
            const allFolders = collectFolders(tree);
            for (const f of allFolders) {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.innerHTML = '&nbsp;'.repeat(f.level * 4) + f.name;
                select.appendChild(opt);
            }
        })
        .catch(() => {
            // Ошибка загрузки папок
            const select = document.getElementById('folderParent');
            select.innerHTML = '<option value="">Ошибка загрузки папок</option>';
        });
}

// Открытие модального окна — подгружаем папки
document.getElementById('createFolderBtn')?.addEventListener('click', function() {
    loadParentFoldersSelect();
    // Сброс формы при открытии
    document.getElementById('createFolderModalForm').reset();
});

// --- Обработка отправки формы создания папки ---
document.getElementById('createFolderModalForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const nameInput = document.getElementById('folderName');
    const parentSelect = document.getElementById('folderParent');
    const name = nameInput.value.trim();
    const parent_id = parentSelect.value ? parseInt(parentSelect.value) : null;

    if (!name) {
        nameInput.classList.add('is-invalid');
        return;
    }
    nameInput.classList.remove('is-invalid');

    // Блокируем кнопку
    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    try {
        const resp = await fetch('/folders/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({name: name, parent_id: parent_id})
        });
        if (resp.redirected) {
            // Закрываем модалку
            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('createFolderModal'));
            modal.hide();
            // Обновляем список папок
            if (typeof foldersTreeData !== 'undefined') {
                // Если глобальная переменная есть, обновим дерево
                fetch('/api/folders')
                    .then(r => r.json())
                    .then(tree => {
                        foldersTreeData = tree;
                        rerenderFolders();
                    });
            } else {
                // Иначе просто перезагрузим страницу
                location.reload();
            }
        } else {
            // Ошибка создания
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Создать';
            alert('Ошибка при создании папки');
        }
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Создать';
        alert('Ошибка сети');
    }
});
</script>

.journal-minimal {
    display: flex;
    align-items: center;
    padding: 2px 0 2px 0;
    border-radius: 3px;
    margin-left: 22px;
    font-size: 0.97em;
    transition: background 0.12s;
    position: relative;
    min-height: 28px;
}
.journal-minimal:hover {
    background: #f8f9fa;
}
.journal-minimal.active {
    background: #e9f5ff;
    box-shadow: inset 3px 0 0 #0d6efd;
}
.journal-minimal.active .bi-journal-text {
    color: #0d6efd;
}
.journal-minimal.active .journal-link {
    color: #0d6efd;
    font-weight: 600;
}
.journal-minimal .bi-journal-text {
    font-size: 1em;
    margin-right: 5px;
    color: #adb5bd;
}
/* Название журнала занимает максимум ширины, не зарезервировано место под 3 точки */
.journal-minimal .journal-link {
    color: #212529;
    text-decoration: none;
    flex: 1 1 0%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    margin-right: 0;
}

/* Контейнер для кнопки 3 точки, не резервирует место, не влияет на ширину названия */
.journal-actions-dropdown {
    position: relative;
    display: flex;
    align-items: center;
    height: 22px;
    margin-left: 2px;
    /* min-width и width убраны, чтобы не мешать названию */
    flex: 0 0 auto;
}

/* Кнопка 3 точки скрыта по умолчанию, появляется только при наведении */
.journal-actions-btn {
    display: none;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-60%);
    padding: 0 4px !important;
    height: 20px !important;
    min-width: 20px !important;
    font-size: 1.05em !important;
    line-height: 1 !important;
    border-radius: 3px !important;
    z-index: 2;
    background: #fff;
    border: none;
}

/* Показываем кнопку только при наведении на .journal-minimal */
.journal-minimal:hover .journal-actions-btn,
.journal-minimal:focus-within .journal-actions-btn {
    display: inline-block;
}

/* По умолчанию скрываем меню опций */
.journal-actions-dropdown .custom-dropdown-menu {
    display: none;
    position: fixed;
    min-width: 160px;
    z-index: 3000;
    background: #fff;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    box-shadow: 0 0.5rem 1rem rgba(0,0,0,.10);
    padding: 0.3rem 0;
    font-size: 0.97em;
}

/* Показываем меню опций, когда у него есть класс show */
.journal-actions-dropdown .custom-dropdown-menu.show {
    display: block;
    animation: fadeIn 0.12s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px);}
    to { opacity: 1; transform: translateY(0);}
}
.journal-actions-dropdown .custom-dropdown-menu .dropdown-header {
    font-size: 0.93em;
    color: #6c757d;
    padding: 0.25rem 1rem 0.25rem 1rem;
}
.journal-actions-dropdown .custom-dropdown-menu .dropdown-item {
    padding: 0.4rem 1rem;
    cursor: pointer;
    white-space: nowrap;
    display: none;
}
/* Показываем .dropdown-item только при наведении на .journal-actions-dropdown */
.journal-actions-dropdown:hover .custom-dropdown-menu .dropdown-item,
.journal-actions-dropdown:focus-within .custom-dropdown-menu .dropdown-item {
    display: block;
}
.journal-actions-dropdown .custom-dropdown-menu .dropdown-item:hover {
    background: #f8f9fa;
}
/* DnD визуал */
.journal-dragging {
    opacity: 0.5;
    background: #ffeeba !important;
}
.folder-drop-target {
    outline: 2px dashed #007bff !important;
    background: #e9f5ff !important;
}

/* Стили для сворачивания сайдбара */
#sidebar.collapsed {
    width: 2.77%
}

#sidebar.collapsed .sidebar-icons {
    width: 100%
}

#sidebar.collapsed .sidebar-content {
    display: none;
    z-index: -1;
}

<script>
function escapeHtml(text) {
    let div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Собираем список всех папок для выпадающего списка
function collectAllFolders(tree, arr = [], level = 0) {
    if (!tree) return arr;
    for (const folder of tree) {
        arr.push({
            id: folder.id,
            name: folder.name,
            level: level
        });
        if (folder.children && folder.children.length > 0) {
            collectAllFolders(folder.children, arr, level + 1);
        }
    }
    return arr;
}

function renderJournals(journals, collapsed, allFolders, currentFolderId) {
    if (!journals || journals.length === 0 || collapsed) return '';
    let html = '';
    const currentMatch = window.location.pathname.match(/\/journal\/(\d+)/);
    const currentId = currentMatch ? String(currentMatch[1]) : null;
    for (const journal of journals) {
        const isActive = currentId && String(journal.id) === currentId;
        html += `
            <div class="journal-minimal journal-draggable${isActive ? ' active' : ''}" data-journal-id="${journal.id}" draggable="true">
                <i class="bi bi-journal-text"></i>
                <a href="/journal/${journal.id}" class="journal-link">${escapeHtml(journal.filename)}</a>
                <div class="journal-actions-dropdown">
                    <button class="btn btn-sm btn-light journal-actions-btn" type="button" title="Действия" data-journal-id="${journal.id}" style="padding:2px 6px;">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <div class="custom-dropdown-menu" data-journal-id="${journal.id}">
                        <div class="dropdown-header">Переместить в папку</div>
                        ${allFolders
                            .filter(f => f.id !== null && f.id != currentFolderId)
                            .map(f => `
                                <div class="dropdown-item move-journal-item" data-move-folder-id="${f.id}">
                                    ${"&nbsp;".repeat(f.level * 2)}<i class="bi bi-folder-fill me-1"></i> ${escapeHtml(f.name)}
                                </div>
                            `).join('')}
                        <div class="dropdown-item" data-action="copy-journal"><i class="bi bi-files me-1"></i> Копировать</div>
                    </div>
                </div>
            </div>
        `;
    }
    return html;
}

// Состояние свёрнутости папок (id: true/false)
let collapsedFolders = {};

function renderFolder(folder, level=0, allFolders) {
    // Цвет и иконка для разных папок
    let colorClass = "text-warning";
    if (folder.id === null) colorClass = "text-secondary";
    else if (folder.name && folder.name.toLowerCase().includes("лич")) colorClass = "text-primary";
    else if (folder.name && folder.name.toLowerCase().includes("проект")) colorClass = "text-success";
    // id для сворачивания
    let folderId = folder.id !== null ? folder.id : 'unsorted';
    let isCollapsed = collapsedFolders[folderId] === true;
    // Иконка chevron-right, поворачиваем при открытии
    let chevronClass = isCollapsed ? "" : " chevron-rotated";
    let html = `
        <div class="folder-minimal folder-dropzone" data-folder-id="${folderId}" style="padding-left: ${level*14 + 2}px;">
            <span class="folder-chevron">
                <i class="bi bi-chevron-right folder-chevron${chevronClass}" data-toggle="collapse-folder" data-folder-id="${folderId}" style="cursor:pointer;"></i>
            </span>
            <i class="bi bi-folder-fill ${colorClass}"></i>
            <span class="folder-name">${escapeHtml(folder.name)}</span>
            ${folder.id !== null ? `
            <div class=\"folder-actions-dropdown\">
                <button class=\"btn btn-sm btn-light folder-actions-btn\" type=\"button\" title=\"Действия\" data-folder-id=\"${folder.id}\" style=\"padding:2px 6px;\">
                    <i class=\"bi bi-three-dots-vertical\"></i>
                </button>
                <div class=\"custom-dropdown-menu\" data-folder-id=\"${folder.id}\">
                    <div class=\"dropdown-item text-danger\" data-action=\"delete-folder\"><i class=\"bi bi-trash me-1\"></i> Удалить папку</div>
                </div>
            </div>
            ` : ''}
        </div>
        <div class="folder-content-anim${isCollapsed ? ' collapsed' : ''}" data-folder-content="${folderId}">
            ${renderJournals(folder.journals, isCollapsed, allFolders, folder.id)}
            ${folder.children && folder.children.length > 0 ? folder.children.map(child => renderFolder(child, level+1, allFolders)).join('') : ''}
        </div>
    `;
    return html;
}

function renderFoldersTree(tree) {
    if (!tree || tree.length === 0) {
        return `<div class="text-muted text-center py-4" style="font-size:0.95em;">Нет папок и журналов</div>`;
    }
    // Собираем список всех папок для выпадающих списков
    const allFolders = collectAllFolders(tree);
    return tree.map(folder => renderFolder(folder, 0, allFolders)).join('');
}
function renderNewFolderForm() {
    return ``;
}

// JS-обработчик для создания папки через fetch
document.addEventListener('DOMContentLoaded', function() {
    function attachCreateFolderHandler() {
        const btn = document.getElementById('create-folder-btn');
        if (!btn) return;
        btn.addEventListener('click', async function() {
            const nameInput = document.getElementById('new-folder-name');
            const parentIdInput = document.getElementById('new-folder-parent-id');
            const name = nameInput.value.trim();
            const parent_id = parentIdInput.value ? parseInt(parentIdInput.value) : null;
            if (!name) {
                nameInput.classList.add('is-invalid');
                return;
            }
            nameInput.classList.remove('is-invalid');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            try {
                const resp = await fetch('/folders/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ name, parent_id })
                });
                if (resp.redirected) {
                    window.location.href = resp.url;
                    return;
                }
                if (resp.ok) {
                    // Обновить дерево папок (или перезагрузить)
                    await loadFoldersTree();
                } else {
                    alert('Ошибка при создании папки');
                }
            } catch (e) {
                alert('Ошибка сети');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-plus-lg"></i> Новая папка';
                nameInput.value = '';
            }
        });
    }
    // attachCreateFolderHandler вызывается после рендера формы
    // Поэтому нужно вызывать его после каждого rerenderFolders
    window.attachCreateFolderHandler = attachCreateFolderHandler;
});

// Вызов attachCreateFolderHandler после рендера формы
const oldRerenderFolders = rerenderFolders;
rerenderFolders = function() {
    oldRerenderFolders.apply(this, arguments);
    if (window.attachCreateFolderHandler) window.attachCreateFolderHandler();
};

let foldersTreeData = null;

function rerenderFolders() {
    const foldersList = document.getElementById('folders-list');
    foldersList.innerHTML = renderFoldersTree(foldersTreeData) + renderNewFolderForm();
    // Назначаем обработчики для сворачивания/разворачивания
    foldersList.querySelectorAll('[data-toggle="collapse-folder"]').forEach(el => {
        el.addEventListener('click', function(e) {
            const folderId = this.getAttribute('data-folder-id');
            collapsedFolders[folderId] = !collapsedFolders[folderId];
            // Анимация: плавно меняем класс collapsed
            const content = foldersList.querySelector(`[data-folder-content="${folderId}"]`);
            // Найти иконку chevron для этой папки
            // (иконка - это <i> с data-toggle="collapse-folder" и data-folder-id=folderId)
            // Важно: использовать именно this, чтобы не сбивать chevron у других папок
            if (content) {
                if (!collapsedFolders[folderId]) {
                    content.classList.remove('collapsed');
                } else {
                    content.classList.add('collapsed');
                }
            }
            // Управляем классом chevron-rotated только у текущей иконки
            if (!collapsedFolders[folderId]) {
                this.classList.add('chevron-rotated');
            } else {
                this.classList.remove('chevron-rotated');
            }
        });
    });

    // --- DnD обработчики для журналов и папок ---
    // Перетаскиваемые журналы
    foldersList.querySelectorAll('.journal-draggable').forEach(journalEl => {
        journalEl.addEventListener('dragstart', function(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.getAttribute('data-journal-id'));
            this.classList.add('journal-dragging');
        });
        journalEl.addEventListener('dragend', function(e) {
            this.classList.remove('journal-dragging');
            // Убираем выделение с папок
            foldersList.querySelectorAll('.folder-drop-target').forEach(f => f.classList.remove('folder-drop-target'));
        });
    });

    // Зоны для дропа — карточки папок
    foldersList.querySelectorAll('.folder-dropzone').forEach(folderEl => {
        folderEl.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('folder-drop-target');
        });
        folderEl.addEventListener('dragleave', function(e) {
            this.classList.remove('folder-drop-target');
        });
        folderEl.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('folder-drop-target');
            const journalId = e.dataTransfer.getData('text/plain');
            const folderId = this.getAttribute('data-folder-id');
            if (journalId && folderId && folderId !== 'unsorted') {
                moveJournalToFolder(journalId, folderId);
            }
        });
    });

    // --- Кастомные выпадающие меню "Переместить в папку" ---
    // Сначала убираем все старые обработчики (на случай повторного рендера)
    document.querySelectorAll('.custom-dropdown-menu.show').forEach(menu => menu.classList.remove('show'));

    foldersList.querySelectorAll('.journal-actions-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            // Закрыть все открытые меню
            document.querySelectorAll('.custom-dropdown-menu.show').forEach(menu => menu.classList.remove('show'));
            // Показать текущее меню
            const journalId = this.getAttribute('data-journal-id');
            const menu = foldersList.querySelector(`.custom-dropdown-menu[data-journal-id="${journalId}"]`);
            if (menu) {
                // Позиционируем меню относительно кнопки (но фиксировано, чтобы не было обрезки)
                const btnRect = this.getBoundingClientRect();
                menu.style.left = (btnRect.left) + 'px';
                menu.style.top = (btnRect.bottom + 2) + 'px';
                menu.classList.add('show');
            }
        });
    });

    // Клик вне меню — закрыть все меню
    document.addEventListener('click', closeAllCustomDropdowns);
    function closeAllCustomDropdowns(e) {
        document.querySelectorAll('.custom-dropdown-menu.show').forEach(menu => {
            if (!menu.contains(e.target)) {
                menu.classList.remove('show');
            }
        });
    }

    // При скролле — закрыть все меню (чтобы не "зависали" в воздухе)
    window.addEventListener('scroll', function() {
        document.querySelectorAll('.custom-dropdown-menu.show').forEach(menu => menu.classList.remove('show'));
    });

    // --- Обработчики для пунктов "Переместить в папку" ---
    foldersList.querySelectorAll('.move-journal-item').forEach(moveItem => {
        moveItem.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const menu = this.closest('.custom-dropdown-menu');
            if (menu) menu.classList.remove('show');
            const journalId = menu.getAttribute('data-journal-id');
            const folderId = this.getAttribute('data-move-folder-id');
            if (journalId && folderId) {
                moveJournalToFolder(journalId, folderId);
            }
        });
    });

    // --- Обработчик для "Копировать" ---
    foldersList.querySelectorAll('.custom-dropdown-menu [data-action="copy-journal"]').forEach(copyBtn => {
        copyBtn.addEventListener('click', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            const menu = this.closest('.custom-dropdown-menu');
            if (menu) menu.classList.remove('show');
            const journalId = menu.getAttribute('data-journal-id');
            if (!journalId) return;
            try {
                // Простое prompt для имени копии; если отмена — используем имя по умолчанию на сервере
                const newName = prompt('Название копии журнала (необязательно):');
                const payload = newName && newName.trim() !== '' ? { filename: newName.trim() } : {};
                const resp = await fetch(`/api/journals/${journalId}/copy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    alert('Не удалось копировать журнал');
                    return;
                }
                const data = await resp.json();
                // Обновляем дерево папок
                const treeResp = await fetch('/api/folders');
                const tree = await treeResp.json();
                foldersTreeData = tree;
                rerenderFolders();
                // Переход к новому журналу
                if (data && data.journal && data.journal.id) {
                    window.location.href = `/journal/${data.journal.id}`;
                }
            } catch (err) {
                alert('Ошибка сети при копировании');
            }
        });
    });

    // --- Папки: показ меню и удаление ---
    foldersList.querySelectorAll('.folder-actions-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            document.querySelectorAll('.custom-dropdown-menu.show').forEach(menu => menu.classList.remove('show'));
            const folderId = this.getAttribute('data-folder-id');
            const menu = foldersList.querySelector(`.folder-actions-dropdown .custom-dropdown-menu[data-folder-id="${folderId}"]`);
            if (menu) {
                const btnRect = this.getBoundingClientRect();
                menu.style.left = (btnRect.left) + 'px';
                menu.style.top = (btnRect.bottom + 2) + 'px';
                menu.classList.add('show');
            }
        });
    });

    foldersList.querySelectorAll('.folder-actions-dropdown .custom-dropdown-menu [data-action="delete-folder"]').forEach(delBtn => {
        delBtn.addEventListener('click', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            const menu = this.closest('.custom-dropdown-menu');
            if (menu) menu.classList.remove('show');
            const folderId = menu.getAttribute('data-folder-id');
            if (!folderId) return;
            if (!confirm('Удалить папку? Документы будут перемещены в «Несортированные», а дочерние папки станут на уровень выше.')) return;
            try {
                const resp = await fetch(`/folders/${folderId}/delete`, { method: 'DELETE' });
                if (!resp.ok) {
                    alert('Не удалось удалить папку');
                    return;
                }
                const treeResp = await fetch('/api/folders');
                const tree = await treeResp.json();
                foldersTreeData = tree;
                rerenderFolders();
            } catch (err) {
                alert('Ошибка сети при удалении');
            }
        });
    });
}

// Перемещение журнала в папку через API
function moveJournalToFolder(journalId, folderId) {
    fetch(`/api/journals/${journalId}/move`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({ folder_id: folderId })
    })
    .then(resp => {
        if (!resp.ok) throw new Error('Ошибка перемещения');
        return resp.json();
    })
    .then(data => {
        showMoveToast(data.journal_filename, data.folder_name);
        // Перерисовать дерево папок и журналов
        return fetch('/api/folders');
    })
    .then(resp => resp.json())
    .then(tree => {
        foldersTreeData = tree;
        rerenderFolders();
    })
    .catch(err => {
        showMoveToast('Ошибка', 'Не удалось переместить', true);
    });
}

// Получение CSRF-токена (если используется Django или Flask-WTF)
function getCSRFToken() {
    let cookie = document.cookie.match('(^|;)\\s*csrftoken\\s*=\\s*([^;]+)');
    if (cookie) return cookie.pop();
    let meta = document.querySelector('meta[name="csrf-token"]');
    if (meta) return meta.getAttribute('content');
    return '';
}

// Тост о переносе
function showMoveToast(journalName, folderName, isError) {
    let toast = document.createElement('div');
    toast.className = 'toast align-items-center ' + (isError ? 'text-bg-danger' : 'text-bg-primary') + ' border-0 show position-fixed top-0 end-0 m-3';
    toast.style.zIndex = 2000;
    toast.innerHTML = `
        <div class="d-flex">
            <div class="toast-body">
                ${isError
                    ? 'Ошибка перемещения'
                    : `Журнал <b>${escapeHtml(journalName)}</b> перемещён в папку <b>${escapeHtml(folderName)}</b>`
                }
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
        </div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 500);
    }, 2000);
    toast.querySelector('.btn-close').onclick = () => toast.remove();
}

document.addEventListener("DOMContentLoaded", function() {
    const foldersList = document.getElementById('folders-list');
    fetch('/api/folders')
        .then(resp => resp.json())
        .then(tree => {
            foldersTreeData = tree;
            rerenderFolders();
        })
        .catch(err => {
            foldersList.innerHTML = `<div class="text-danger text-center py-4">Ошибка загрузки папок</div>`;
        });

    // Можно добавить обработку кликов по папкам/журналам для динамического отображения содержимого справа
    // или оставить как есть (переход по ссылке на журнал)
});
</script>
