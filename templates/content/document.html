{# document.html #}
<style>
.editor-block {
  padding: 6px 4px;
  margin: 2px 0;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: background 0.15s, border 0.15s;
}
.editor-block {
  position: relative;
  padding-left: 26px;
}
/* .editor-block:hover {
  background: #f7f7f9;
} */
.editor-block:focus {
  outline: none;
  border: 1px solid transparent;
  background: #f9f9fb;
}
.block-content:focus {
  outline: none;
}
.drag-handle {
  position: absolute;
  left: 4px; top: 6px;
  font-size: 14px; color: #888;
  cursor: grab; user-select: none;
  opacity: 0; transition: opacity 0.15s;
}
.editor-block:hover .drag-handle,
.editor-block:focus-within .drag-handle { opacity: 1; }
.editor-block.drag-over {
  border: 2px dashed #0d6efd;
  background: #e9f3ff;
}
.editor-block.dragging {
  opacity: 0.5;
}

.editor-block.dragging {
  opacity: 0.5;
}

.mini-excel-table {
  border-collapse: collapse;
  margin-top: 20px;
}
.mini-excel-table td, .mini-excel-table th {
  border: 1px solid #ccc;
  height: 30px;
  text-align: center;
}
.mini-excel-table td.mx-selected { outline: 2px solid #0d6efd; outline-offset: -2px; }
.mini-excel-table td.mx-selected { outline: 2px solid #0d6efd; outline-offset: -2px; }
.mini-excel-table input {
  width: 95%;
  border: none;
  outline: none;
  text-align: center;
}
.mini-excel-toolbar {
  display: flex;
  gap: 6px;
  margin: 4px 0 8px;
}
.mini-excel-container {
  margin: 8px 0;
  position: relative;
}
.mini-excel-root table { width: max-content; }
.mini-excel-plus { position: absolute; z-index: 5; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #ced4da; color: #495057; box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; opacity: .85; transition: opacity .15s, transform .1s; font-weight: 600; padding: 0; pointer-events: auto; }
.mini-excel-plus:hover { opacity: 1; }
.mini-excel-add-row { pointer-events: auto; }
.mini-excel-add-col { pointer-events: auto; }
.mini-excel-del-row { position: absolute; z-index: 5; width: 18px; height: 18px; border-radius: 50%; display:flex; align-items:center; justify-content:center; background:#fff; color:#dc3545; border:1px solid #f1aeb5; box-shadow:0 1px 2px rgba(0,0,0,.06); font-weight:700; cursor:pointer; opacity:.75; transition: opacity .15s; }
.mini-excel-del-row:hover { opacity: 1; }
.timeline-marker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f1f3f5;
  color: #495057;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  margin: 10px 0;
}
.timeline-marker .tm-dot {
  color: #0d6efd;
}
.col-resize {
  position: absolute;
  right: 0;
  top: 0;
  width: 5px;
  height: 100%;
  cursor: col-resize;
  user-select: none;
}
td.pointer-mode input {
  cursor: pointer;
}
/* Прелоадер и скрытие до инициализации */
.hidden-until-init { opacity: 0; pointer-events: none; }
.journal-preloader-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: #ffffff; z-index: 20;
}
.journal-spinner { width: 44px; height: 44px; border: 4px solid #e9ecef; border-top-color: #0d6efd; border-radius: 50%; animation: journalSpin 1s linear infinite; }
@keyframes journalSpin { to { transform: rotate(360deg); } }
/* Lazy image styles */
.journal-image-block { position: relative; min-height: 120px; }
.journal-image-block.loading .journal-image-spinner { display: block; }
.journal-image-spinner { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; border: 3px solid #e9ecef; border-top-color: #0d6efd; border-radius: 50%; animation: journalSpin 1s linear infinite; }
</style>

<div id="journal-wrapper" style="position: relative;">
  <div id="journal-preloader" class="journal-preloader-overlay">
    <div class="journal-spinner" aria-label="Загрузка..."></div>
  </div>

  <div class="d-flex" style="gap: 24px;">
      <div id="notion-like-document" class="notion-document mt-2 hidden-until-init" style="flex: 2 1 0; overflow-y: auto; min-width: 0;">
          <div class="d-flex align-items-center mb-3">
              <i class="bi bi-file-earmark-text me-2"></i>
              <h2 contenteditable="true" class="mb-0" id="filename" placeholder="Введите название документа..."></h2>
          </div>
          <div id="document-content" class="document-content" style="max-height: 79vh; overflow-y: auto;">
              <div class="notion-block border border-0" id="editor" placeholder="Начните писать здесь..."></div>
            </div>
          </div>
      <div id="timeline-panel" class="d-none d-md-block hidden-until-init" style="width: 200px; max-height: 85vh; overflow-y: auto; padding-top: 8px;"></div>
  </div>
</div>
