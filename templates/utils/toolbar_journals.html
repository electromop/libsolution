        <script>
            // Показываем/скрываем выпадающий date picker по клику на кнопку
            const dateBtn = document.getElementById('date-picker-btn');
            const dateInput = document.getElementById('date-picker-input');
            const dateInsertBtn = document.getElementById('date-insert-btn');

            dateBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (dateInput.style.display === 'none' || !dateInput.style.display) {
                    dateInput.style.display = 'block';
                    dateInsertBtn.style.display = 'block';
                    dateInput.focus();
                } else {
                    dateInput.style.display = 'none';
                    dateInsertBtn.style.display = 'none';
                }
            });

            // При выборе даты активируем кнопку "Вставить"
            dateInput.addEventListener('input', function() {
                if (dateInput.value) {
                    dateInsertBtn.disabled = false;
                } else {
                    dateInsertBtn.disabled = true;
                }
            });

            // При нажатии на "Вставить" вставляем блок и скрываем date picker
            dateInsertBtn.addEventListener('click', function() {
                if (!dateInput.value) return;
                const [year, month, day] = dateInput.value.split('-');
                const dateStr = `${day}.${month}.${year}`;
                // Вставка блока даты в редактор
                const editor = document.getElementById('editor');
                if (editor) {
                    const dateBlock = document.createElement('div');
                    dateBlock.className = 'journal-date-block';
                    dateBlock.innerHTML = `<b>${dateStr}</b>`;
                    editor.appendChild(dateBlock);
                }
                dateInput.style.display = 'none';
                dateInsertBtn.style.display = 'none';
                dateInput.value = '';
                dateInsertBtn.disabled = true;
            });

            // Скрываем date picker и кнопку при клике вне
            document.addEventListener('click', function(e) {
                if (!dateInput.contains(e.target) && e.target !== dateBtn && e.target !== dateInsertBtn) {
                    dateInput.style.display = 'none';
                    dateInsertBtn.style.display = 'none';
                }
            });

            // Изначально кнопка "Вставить" неактивна
            dateInsertBtn.disabled = true;
        </script>
        <script>
            (function() {
                const toggleBtn = document.getElementById('substance-insert-btn');
                const popover = document.getElementById('substance-search-popover');
                const input = document.getElementById('substance-search-input');
                const results = document.getElementById('substance-search-results');
                if (!toggleBtn || !popover || !input || !results) return;

                function escapeHtml(str) {
                    return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
                }

                const debounce = (fn, delay = 300) => {
                    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(null, args), delay); };
                };

                function openPopover() {
                    popover.style.display = 'block';
                    setTimeout(() => input.focus(), 0);
                }
                function closePopover() {
                    popover.style.display = 'none';
                    input.value = '';
                    results.innerHTML = '';
                }

                // Не давать кнопке уводить фокус (сохраняем каретку в блоке)
                toggleBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                });
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (popover.style.display === 'none' || !popover.style.display) {
                        openPopover();
                    } else {
                        closePopover();
                    }
                });
                document.addEventListener('click', (e) => {
                    if (!popover.contains(e.target) && e.target !== toggleBtn) {
                        closePopover();
                    }
                });

                async function search(query) {
                    const q = query.trim();
                    results.innerHTML = '<div class="text-muted px-2 py-1">Загрузка...</div>';
                    try {
                        let byName = [], byData = [];
                        if (!q) {
                            // Пустой запрос — грузим все вещества
                            byName = await fetch(`/items/`).then(r => r.ok ? r.json() : []);
                        } else {
                            const urls = [
                                `/search/name/?query=${encodeURIComponent(q)}`,
                                `/search/data/?query=${encodeURIComponent(q)}`
                            ];
                            const res = await Promise.all(urls.map(u => fetch(u).then(r => r.ok ? r.json() : [])));
                            byName = res[0] || [];
                            byData = res[1] || [];
                        }
                        const merged = [];
                        const seen = new Set();
                        for (const it of [...byName, ...byData]) {
                            if (!seen.has(it.id)) { seen.add(it.id); merged.push(it); }
                        }
                        renderResults(merged, q);
                    } catch (e) {
                        results.innerHTML = '<div class="text-danger px-2 py-1">Ошибка поиска</div>';
                    }
                }
                const debouncedSearch = debounce(search, 350);
                input.addEventListener('input', (e) => debouncedSearch(e.target.value));

                function renderResults(items, query) {
                    results.innerHTML = '';
                    if (!items || items.length === 0) {
                        results.innerHTML = '<div class="text-muted px-2 py-1">Ничего не найдено</div>';
                        return;
                    }
                    items.forEach(item => {
                        const a = document.createElement('button');
                        a.type = 'button';
                        a.className = 'list-group-item list-group-item-action';
                        const nm = item.name || 'Без названия';
                        a.innerHTML = `<div class="fw-semibold">${escapeHtml(nm)}</div>`;
                        a.addEventListener('click', () => {
                            insertSubstanceLink(item);
                            closePopover();
                        });
                        results.appendChild(a);
                    });
                }

                // Храним последний валидный range внутри редактора
                let lastSelectionRange = null;
                function isNodeInsideEditor(node, editor) {
                    while (node) { if (node === editor) return true; node = node.parentNode; }
                    return false;
                }
                document.addEventListener('selectionchange', () => {
                    const editor = document.getElementById('editor');
                    if (!editor) return;
                    const sel = window.getSelection && window.getSelection();
                    if (!sel || sel.rangeCount === 0) return;
                    const range = sel.getRangeAt(0);
                    const container = range.commonAncestorContainer;
                    if (isNodeInsideEditor(container, editor)) {
                        lastSelectionRange = range.cloneRange();
                    }
                });
                function restoreSelection() {
                    if (!lastSelectionRange) return false;
                    const sel = window.getSelection && window.getSelection();
                    if (!sel) return false;
                    sel.removeAllRanges();
                    sel.addRange(lastSelectionRange);
                    return true;
                }
                function findFocusedBlockContent() {
                    const editor = document.getElementById('editor');
                    if (!editor) return null;
                    const active = document.activeElement;
                    if (active && active.classList && active.classList.contains('block-content')) return active;
                    const blocks = editor.querySelectorAll('.editor-block .block-content');
                    if (blocks.length > 0) return blocks[blocks.length - 1];
                    return null;
                }

                function insertSubstanceLink(item) {
                    const editor = document.getElementById('editor');
                    if (!editor) return;
                    const name = item.name || 'Без названия';
                    const url = `/item?item_id=${encodeURIComponent(item.id)}`;
                    const wrapper = document.createElement('span');
                    wrapper.className = 'substance-link';
                    wrapper.setAttribute('contenteditable', 'false');
                    wrapper.setAttribute('data-item-id', item.id);
                    const link = document.createElement('a');
                    link.href = url;
                    link.textContent = name;
                    link.style.pointerEvents = 'auto';
                    wrapper.appendChild(link);
                    const spacer = document.createTextNode(' ');

                    let content = findFocusedBlockContent();
                    let sel = window.getSelection ? window.getSelection() : null;
                    if (!content) {
                        // Создадим новый абзац, если нет активного
                        const newBlock = editor.querySelector('.editor-block:last-child .block-content');
                        content = newBlock || null;
                    }
                    if (!content) return;

                    // Восстановим каретку, если она была в редакторе
                    if (!restoreSelection()) {
                        content.focus();
                    }
                    try {
                        if (sel && sel.rangeCount > 0) {
                            let range = sel.getRangeAt(0);
                            // Убедимся, что курсор внутри редактора
                            let node = range.commonAncestorContainer;
                            let inside = false;
                            while (node) { if (node === editor) { inside = true; break; } node = node.parentNode; }
                            if (!inside) {
                                range = document.createRange();
                                range.selectNodeContents(content);
                                range.collapse(false);
                            }
                            // Вставляем плашку
                            range.insertNode(wrapper);
                            // Сразу после — пробел и ставим каретку после него
                            const afterRange = document.createRange();
                            afterRange.setStartAfter(wrapper);
                            afterRange.collapse(true);
                            afterRange.insertNode(spacer);
                            const caretRange = document.createRange();
                            caretRange.setStart(spacer, spacer.length);
                            caretRange.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(caretRange);
                        } else {
                            content.appendChild(wrapper);
                            content.appendChild(spacer);
                        }
                    } catch (_) {
                        content.appendChild(wrapper);
                        content.appendChild(spacer);
                    }

                    // Сохранить блок через WS
                    const blockEl = content.closest('.editor-block');
                    const blockId = blockEl && blockEl.getAttribute('data-block-id');
                    if (blockId && window.wsBlocks && typeof window.wsBlocks.sendBlockUpdate === 'function') {
                        window.wsBlocks.sendBlockUpdate(blockId, content.innerHTML);
                    } else {
                        // Fallback: инициируем input событие, чтобы сработал дебаунс сохранения
                        content.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }

                // Немного стилизации для ссылок вещества
                const style = document.createElement('style');
                style.textContent = `.substance-link{padding:2px 6px; border-radius:10px; background:#eef6ff; color:#0d6efd; text-decoration:none; margin:0 2px; display:inline-block;} .substance-link a{ color:#0d6efd; text-decoration:none; pointer-events:auto; }`;
                document.head.appendChild(style);

                // Тултип при наведении на вставленную плашку вещества
                const tooltipStyle = document.createElement('style');
                tooltipStyle.textContent = `
                    .substance-tooltip{ position: fixed; z-index: 2000; background: #1f2630; color:#e9ecef; border: 1px solid #2b333e; border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25); max-width: 360px; }
                    .substance-tooltip .st-title{ font-weight: 600; margin-bottom: 6px; }
                    .substance-tooltip .st-row{ display:flex; justify-content: space-between; gap: 8px; margin: 2px 0; }
                    .substance-tooltip .st-key{ color:#a8b2bf; }
                    .substance-tooltip .st-val{ color:#e9ecef; text-align: right; }
                `;
                document.head.appendChild(tooltipStyle);

                const tooltip = document.createElement('div');
                tooltip.className = 'substance-tooltip';
                tooltip.style.display = 'none';
                document.body.appendChild(tooltip);

                const itemCache = new Map(); // id -> данные item (GET /items/{id})
                let hoverTimer = null;
                let activeLink = null;

                function renderTooltip(item) {
                    const rows = [];
                    const data = item && item.data && typeof item.data === 'object' ? item.data : {};
                    const keys = Object.keys(data).slice(0, 6);
                    for (const k of keys) {
                        rows.push(`<div class="st-row"><div class="st-key">${escapeHtml(k)}</div><div class="st-val">${escapeHtml(String(data[k]))}</div></div>`);
                    }
                    tooltip.innerHTML = `
                        <div class="st-title">${escapeHtml(item?.name || 'Без названия')}</div>
                        ${rows.join('') || '<div class="st-row"><div class="st-key">Нет данных</div></div>'}
                    `;
                }

                function positionTooltip(x, y) {
                    const offset = 12;
                    const rect = tooltip.getBoundingClientRect();
                    let left = x + offset;
                    let top = y + offset;
                    if (left + rect.width > window.innerWidth - 8) left = x - rect.width - offset;
                    if (top + rect.height > window.innerHeight - 8) top = y - rect.height - offset;
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                }

                async function showTooltipForLink(linkEl, clientX, clientY) {
                    const id = linkEl && linkEl.getAttribute('data-item-id');
                    if (!id) return;
                    try {
                        let item = itemCache.get(id);
                        if (!item) {
                            const res = await fetch(`/items/${encodeURIComponent(id)}`);
                            if (!res.ok) return;
                            item = await res.json();
                            itemCache.set(id, item);
                        }
                        renderTooltip(item);
                        tooltip.style.display = 'block';
                        positionTooltip(clientX, clientY);
                    } catch (_) {}
                }

                document.addEventListener('mouseover', (e) => {
                    const linkEl = e.target && e.target.closest && e.target.closest('.substance-link');
                    if (!linkEl) return;
                    activeLink = linkEl;
                    if (hoverTimer) clearTimeout(hoverTimer);
                    hoverTimer = setTimeout(() => {
                        showTooltipForLink(linkEl, e.clientX, e.clientY);
                    }, 200);
                });
                document.addEventListener('mousemove', (e) => {
                    if (tooltip.style.display === 'block') positionTooltip(e.clientX, e.clientY);
                });
                document.addEventListener('mouseout', (e) => {
                    const toEl = e.relatedTarget;
                    const fromEl = e.target && e.target.closest && e.target.closest('.substance-link');
                    if (!fromEl) return;
                    if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
                    if (!fromEl.contains(toEl)) {
                        tooltip.style.display = 'none';
                        activeLink = null;
                    }
                });
            })();
        </script>
        <script>
            // Синхронизация выпадающего списка размера шрифта с текущим выделением
            (function() {
                const sizeSelect = document.getElementById('font-size-select');
                const sizeOptions = [10, 13, 16, 18, 24, 32, 48];

                window.changeFontSize = function(val) {
                    const px = parseInt(val, 10);
                    if (!px) return;
                    // Используем execCommand для оборачивания, затем заменяем <font> на <span style>
                    document.execCommand('fontSize', false, '7');
                    try {
                        const editor = document.getElementById('editor');
                        editor && editor.querySelectorAll('font[size="7"]').forEach(font => {
                            const span = document.createElement('span');
                            span.style.fontSize = px + 'px';
                            span.innerHTML = font.innerHTML;
                            font.replaceWith(span);
                        });
                    } catch (_) {}
                    if (sizeSelect) sizeSelect.value = String(px);
                }

                function nearestOption(px) {
                    let best = sizeOptions[0];
                    let diff = Infinity;
                    for (const s of sizeOptions) {
                        const d = Math.abs(px - s);
                        if (d < diff) { diff = d; best = s; }
                    }
                    return best;
                }

                function getSelectionFontSizePx() {
                    const sel = window.getSelection();
                    if (!sel || sel.rangeCount === 0) return null;
                    let node = sel.anchorNode;
                    if (!node) return null;
                    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
                    if (!(node instanceof Element)) return null;
                    // Убедимся, что курсор внутри редактора
                    let el = node;
                    let insideEditor = false;
                    while (el && el !== document) {
                        if (el.id === 'editor') { insideEditor = true; break; }
                        el = el.parentElement;
                    }
                    if (!insideEditor) return null;
                    const computed = window.getComputedStyle(node);
                    const fs = computed && computed.fontSize; // например, "16px"
                    if (!fs) return null;
                    const m = fs.match(/(\d+(?:\.\d+)?)/);
                    return m ? parseFloat(m[1]) : null;
                }

                function updateFontSizeSelect() {
                    if (!sizeSelect) return;
                    const px = getSelectionFontSizePx();
                    if (!px) { sizeSelect.value = ''; return; }
                    sizeSelect.value = String(nearestOption(px));
                }

                document.addEventListener('selectionchange', updateFontSizeSelect);
                document.addEventListener('DOMContentLoaded', updateFontSizeSelect);
            })();
        </script>

    <script>
        // Функция для вставки блока с датой и заголовком в журнал с выбором даты через date picker
        function addDate() {
            // Найти редактор (notion-block/editor)
            const editor = document.getElementById('editor');
            if (!editor) {
                alert('Не найден элемент с id "editor"');
                return;
            }

            // Создать input type="date" для выбора даты
            const dateInput = document.createElement('input');
            dateInput.type = 'date';
            dateInput.style.position = 'fixed';
            dateInput.style.left = '-9999px';
            document.body.appendChild(dateInput);
            console.log('дата')
            // Когда пользователь выберет дату
            dateInput.onchange = function() {
                const value = dateInput.value;
                document.body.removeChild(dateInput);

                if (!value) return;

                // value в формате "YYYY-MM-DD"
                const [year, month, day] = value.split('-');
                const dateStr = `${day}.${month}.${year}`;

                // Создать контейнер блока даты
                const dateBlock = document.createElement('div');
                dateBlock.className = 'journal-date-block';
                dateBlock.setAttribute('data-type', 'date-block');
                dateBlock.style.display = 'flex';
                dateBlock.style.alignItems = 'center';
                dateBlock.style.gap = '16px';
                dateBlock.style.margin = '24px 0 12px 0';
                dateBlock.style.padding = '8px 0';

                // Добавить элемент даты
                const dateElem = document.createElement('div');
                dateElem.className = 'journal-date';
                dateElem.textContent = dateStr;
                dateElem.style.fontWeight = 'bold';
                dateElem.style.fontSize = '18px';
                dateElem.style.color = '#3b3b3b';
                dateElem.style.flexShrink = '0';

                // Добавить редактируемый заголовок
                const titleElem = document.createElement('div');
                titleElem.className = 'journal-date-title';
                titleElem.contentEditable = 'true';
                titleElem.setAttribute('placeholder', 'Заголовок дня...');
                titleElem.style.outline = 'none';
                titleElem.style.minWidth = '120px';
                titleElem.style.fontSize = '16px';
                titleElem.style.color = '#555';
                titleElem.style.borderBottom = '1px dashed #bbb';
                titleElem.style.padding = '2px 8px';
                titleElem.style.marginLeft = '8px';

                // Для будущего таймлайна: можно добавить data-атрибуты или id
                dateBlock.setAttribute('data-date', dateStr);

                // Собрать блок
                dateBlock.appendChild(dateElem);
                dateBlock.appendChild(titleElem);

                // Вставить блок в редактор (в начало или в текущее место курсора)
                let inserted = false;
                if (window.getSelection) {
                    const sel = window.getSelection();
                    if (sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        // Проверим, что курсор внутри редактора
                        let node = range.commonAncestorContainer;
                        while (node) {
                            if (node === editor) {
                                range.collapse(false);
                                range.insertNode(dateBlock);
                                // Переместить курсор в заголовок
                                setTimeout(() => {
                                    titleElem.focus();
                                }, 0);
                                inserted = true;
                                break;
                            }
                            node = node.parentNode;
                        }
                    }
                }
                if (!inserted) {
                    // Если не удалось вставить по курсору — добавить в конец
                    editor.appendChild(dateBlock);
                    titleElem.focus();
                }
            };

        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('tag-add-toggle-btn');
            const form = document.getElementById('tag-add-form');
            const input = document.getElementById('tag-input');
            const list = document.getElementById('tag-suggest');
            let allTags = [];

            function openForm() {
                form.style.display = 'block';
                setTimeout(() => input.focus(), 0);
                list.innerHTML = '<div class="text-muted px-2 py-1">Загрузка...</div>';
                fetchAllTags().then(() => renderTagList(allTags, ''));
            }
            function closeForm() {
                form.style.display = 'none';
                input.value = '';
                list.innerHTML = '';
            }
            if (toggleBtn && form) {
                toggleBtn.addEventListener('mousedown', (e) => e.preventDefault());
                toggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (form.style.display === 'none' || !form.style.display) openForm(); else closeForm();
                });
                document.addEventListener('click', function(event) {
                    if (!form.contains(event.target) && event.target !== toggleBtn) closeForm();
                });
            }

            async function fetchAllTags() {
                try {
                    const res = await fetch('/api/tags');
                    if (!res.ok) { console.warn('[TAGS] fetch /tags/ status', res.status); return false; }
                    let json;
                    try { json = await res.json(); }
                    catch(parseErr) {
                        const txt = await res.text().catch(() => '');
                        console.warn('[TAGS] parse error, body starts with:', (txt || '').slice(0,120));
                        return false;
                    }
                    if (Array.isArray(json)) { allTags = json; return true; }
                    return false;
                } catch(err) {
                    console.warn('[TAGS] fetch error', err);
                    return false;
                }
            }

            async function createTag(name) {
                const n = String(name || '').trim();
                if (!n) return;
                try {
                    const res = await fetch('/api/tags', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: n })
                    });
                    if (!res.ok) {
                        let data = {};
                        try { data = await res.json(); } catch(_){ }
                        alert(data?.detail || 'Ошибка создания тега');
                        // Если тег уже существует, попробуем просто привязать
                        if (String(data?.detail || '').toLowerCase().includes('уже существует')) {
                            if (window.tagManager && typeof window.tagManager.addTagByName === 'function') {
                                window.tagManager.addTagByName(n);
                            }
                            closeForm();
                        }
                        return;
                    }
                    const tag = await res.json();
                    allTags.push(tag);
                    // Перерисуем список с учётом нового тега, если форма открыта
                    try { renderTagList(allTags, ''); } catch(_) {}
                    if (window.tagManager && typeof window.tagManager.addTagByName === 'function') {
                        window.tagManager.addTagByName(tag.name);
                    }
                    closeForm();
                } catch(_) {
                    alert('Ошибка создания тега');
                }
            }

            function renderTagList(items, query) {
                list.innerHTML = '';
                if (!items || items.length === 0) {
                    list.innerHTML = '<div class="text-muted px-2 py-1">Нет тегов</div>';
                    return;
                }
                const q = (query || '').toLowerCase();
                const filtered = items.filter(t => !q || String(t.name || '').toLowerCase().includes(q));
                if (filtered.length === 0 && q) {
                    const createBtn = document.createElement('button');
                    createBtn.type = 'button';
                    createBtn.className = 'list-group-item list-group-item-action text-primary';
                    createBtn.textContent = `Создать тег: ${query}`;
                    createBtn.addEventListener('click', () => createTag(query));
                    list.appendChild(createBtn);
                    return;
                }
                filtered.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'list-group-item list-group-item-action';
                    btn.textContent = tag.name || 'Без названия';
                    btn.addEventListener('mousedown', (e) => e.preventDefault());
                    btn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        try {
                            if (window.tagManager && typeof window.tagManager.addTagByName === 'function') {
                                btn.disabled = true;
                                await window.tagManager.addTagByName(tag.name);
                            }
                        } finally {
                            btn.disabled = false;
                            closeForm();
                        }
                    });
                    list.appendChild(btn);
                });
            }

            const debounce = (fn, delay = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn.apply(null, a), delay); }; };
            input && input.addEventListener('input', debounce(() => renderTagList(allTags, input.value), 250));
        });

    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

    <script>
    // Класс для блока вставки фото
    class PhotoInsertBlock {
        constructor(editor) {
            this.editor = editor;
            this.block = document.createElement('div');
            this.block.className = 'photo-insert-block';

            this.fileInput = document.createElement('input');
            this.fileInput.type = 'file';
            this.fileInput.accept = 'image/*';

            this.editBtn = document.createElement('button');
            this.editBtn.className = 'photo-insert-edit-btn';
            this.editBtn.textContent = 'Изменить';
            this.editBtn.setAttribute('contenteditable', 'false');
            this.editBtn.style.display = 'none';

            this.placeholder = document.createElement('div');
            this.placeholder.className = 'photo-insert-placeholder';
            this.placeholder.textContent = 'Нажмите, чтобы добавить фото';

            this.img = document.createElement('img');
            this.img.style.display = 'none';

            this.currentImageData = null;

            this.fileInput.addEventListener('change', this.onFileChange.bind(this));
            this.block.addEventListener('click', this.onBlockClick.bind(this));
            this.editBtn.addEventListener('click', this.onEditClick.bind(this));

            this.block.appendChild(this.img);
            this.block.appendChild(this.placeholder);
            this.block.appendChild(this.editBtn);
            this.block.appendChild(this.fileInput);

            this.editor.appendChild(this.block);

            setTimeout(() => this.fileInput.click(), 100);
        }

        onFileChange() {
            if (this.fileInput.files && this.fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.img.src = e.target.result;
                    this.img.style.display = 'block';
                    this.placeholder.style.display = 'none';
                    this.editBtn.style.display = 'block';
                    this.block.classList.add('has-photo');
                    this.currentImageData = e.target.result;
                };
                reader.readAsDataURL(this.fileInput.files[0]);
            }
        }

        onBlockClick(e) {
            if (e.target === this.editBtn) return; // обработка отдельно
            if (!this.img.src || this.img.style.display === 'none') {
                this.fileInput.click();
            } else {
                this.openEditor();
            }
        }

        onEditClick(e) {
            e.stopPropagation();
            this.openEditor();
        }

        openEditor() {
            if (!this.img.src) {
                alert('Сначала выберите изображение!');
                return;
            }
            window.PhotoEditorModal.open(this.img, (dataUrl) => {
                this.img.src = dataUrl;
                this.currentImageData = dataUrl;
            });
        }
    }

    // Класс для модального редактора
    class PhotoEditorModalClass {
        constructor() {
            this.modal = document.getElementById('image-editor-modal');
            this.canvasEl = document.getElementById('image-editor-canvas');
            this.fabricCanvas = null;
            this.mode = 'draw-free';
            this.callback = null;
            this.image = null;
            this.backgroundImage = null;
            this._setupToolbar();
        }

        open(imgElement, onSaveCallback) {
            this.modal.classList.add('active');
            this.callback = onSaveCallback;
            this.image = imgElement;

            if (this.fabricCanvas) {
                this.fabricCanvas.dispose();
            }

            // Загружаем картинку
            const tempImg = new window.Image();
            tempImg.onload = () => {
                let maxW = Math.min(800, window.innerWidth * 0.8);
                let maxH = Math.min(500, window.innerHeight * 0.6);
                let scale = Math.min(maxW / tempImg.width, maxH / tempImg.height, 1);
                let w = tempImg.width * scale;
                let h = tempImg.height * scale;
                this.canvasEl.width = w;
                this.canvasEl.height = h;
                this.canvasEl.style.width = w + 'px';
                this.canvasEl.style.height = h + 'px';

                this.fabricCanvas = new fabric.Canvas('image-editor-canvas', {
                    width: w,
                    height: h,
                    selection: true,
                    backgroundColor: '#fff'
                });

                fabric.Image.fromURL(imgElement.src, (fabricImg) => {
                    fabricImg.set({
                        left: 0,
                        top: 0,
                        scaleX: w / tempImg.width,
                        scaleY: h / tempImg.height,
                        selectable: false,
                        evented: false
                    });
                    this.backgroundImage = fabricImg;
                    this.fabricCanvas.setBackgroundImage(fabricImg, this.fabricCanvas.renderAll.bind(this.fabricCanvas));
                    this.setMode('draw-free');
                    this._setupEvents();
                }, { crossOrigin: 'anonymous' });
            };
            if (!imgElement.src) {
                alert('Сначала выберите изображение!');
                this.close();
                return;
            }
            tempImg.src = imgElement.src;
        }

        close() {
            this.modal.classList.remove('active');
            if (this.fabricCanvas) {
                this.fabricCanvas.dispose();
                this.fabricCanvas = null;
            }
            this.callback = null;
            this.image = null;
        }

        setMode(mode) {
            this.mode = mode;
            document.getElementById('draw-free-btn').classList.toggle('active', mode === 'draw-free');
            document.getElementById('draw-line-btn').classList.toggle('active', mode === 'draw-line');
            document.getElementById('move-btn').classList.toggle('active', mode === 'move');
            document.getElementById('text-btn').classList.toggle('active', mode === 'text');
            if (this.fabricCanvas) {
                if (mode === 'draw-free') {
                    this.fabricCanvas.isDrawingMode = true;
                    this.fabricCanvas.selection = false;
                    this.fabricCanvas.forEachObject(obj => obj.selectable = false);
                } else if (mode === 'draw-line') {
                    this.fabricCanvas.isDrawingMode = false;
                    this.fabricCanvas.selection = false;
                    this.fabricCanvas.forEachObject(obj => obj.selectable = false);
                } else if (mode === 'move') {
                    this.fabricCanvas.isDrawingMode = false;
                    this.fabricCanvas.selection = true;
                    this.fabricCanvas.forEachObject(obj => obj.selectable = true);
                } else if (mode === 'text') {
                    this.fabricCanvas.isDrawingMode = false;
                    this.fabricCanvas.selection = false;
                    this.fabricCanvas.forEachObject(obj => obj.selectable = false);
                }
            }
        }

        save() {
            if (!this.fabricCanvas) return;
            this.fabricCanvas.discardActiveObject();
            this.fabricCanvas.renderAll();
            const dataUrl = this.fabricCanvas.toDataURL({
                format: 'png',
                multiplier: 1
            });
            if (this.callback) {
                this.callback(dataUrl);
            }
            this.close();
        }

        _setupToolbar() {
            // Для совместимости с onclick в html
            window.PhotoEditorModal = this;
        }

        _setupEvents() {
            const canvas = this.fabricCanvas;
            if (!canvas) return;
            canvas.off();

            // Для рисования линий
            let line, isDown = false;
            canvas.on('mouse:down', (o) => {
                if (this.mode === 'draw-line') {
                    isDown = true;
                    const pointer = canvas.getPointer(o.e);
                    const points = [ pointer.x, pointer.y, pointer.x, pointer.y ];
                    line = new fabric.Line(points, {
                        strokeWidth: 3,
                        fill: '#007bff',
                        stroke: '#007bff',
                        originX: 'center',
                        originY: 'center',
                        selectable: false,
                        evented: false
                    });
                    canvas.add(line);
                } else if (this.mode === 'text') {
                    const pointer = canvas.getPointer(o.e);
                    const text = new fabric.IText('Текст', {
                        left: pointer.x,
                        top: pointer.y,
                        fontSize: 20,
                        fill: '#222'
                    });
                    canvas.add(text);
                    canvas.setActiveObject(text);
                    text.enterEditing();
                    this.setMode('move');
                }
            });
            canvas.on('mouse:move', (o) => {
                if (this.mode === 'draw-line' && isDown && line) {
                    const pointer = canvas.getPointer(o.e);
                    line.set({ x2: pointer.x, y2: pointer.y });
                    canvas.renderAll();
                }
            });
            canvas.on('mouse:up', (o) => {
                if (this.mode === 'draw-line' && isDown) {
                    isDown = false;
                    if (line) {
                        line.setCoords();
                        line.selectable = true;
                        line.evented = true;
                        this.setMode('move');
                    }
                    line = null;
                }
            });

            // Для выделения и перемещения объектов
            canvas.on('object:selected', function(e) {
                e.target.set({
                    borderColor: '#007bff',
                    cornerColor: '#007bff',
                    cornerSize: 10,
                    transparentCorners: false,
                    borderDashArray: [4, 4]
                });
                canvas.renderAll();
            });
            canvas.on('selection:cleared', function(e) {
                canvas.renderAll();
            });

            // Для рисования от руки
            if (this.mode === 'draw-free') {
                canvas.isDrawingMode = true;
                canvas.freeDrawingBrush.color = '#007bff';
                canvas.freeDrawingBrush.width = 3;
            } else {
                canvas.isDrawingMode = false;
            }
        }
    }

    // Глобальный экземпляр редактора
    window.PhotoEditorModal = new PhotoEditorModalClass();

    // Глобальная функция для кнопки
    function inserPhoto() {
        const editor = document.getElementById('editor');
        if (!editor) return;
        new PhotoInsertBlock(editor);
    }

    (function() {

        async function loadPrivacy() {
            const id = getJournalId(); if (!id) return;
            try {
                const res = await fetch(`/api/journals/${id}/privacy`);
                if (!res.ok) return;
                const data = await res.json();
                privacySwitch.checked = !!data.is_private;
            } catch(_) {}
        }
        async function savePrivacy(val) {
            const id = getJournalId(); if (!id) return;
            try {
                await fetch(`/api/journals/${id}/privacy`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ is_private: !!val }) });
            } catch(_) {}
        }
        async function loadAccessList() {
            const id = getJournalId(); if (!id) return;
            try {
                const res = await fetch(`/api/journals/${id}/access`);
                const data = await res.json();
                renderAccessList(Array.isArray(data) ? data : []);
            } catch(_) { renderAccessList([]); }
        }
        function renderAccessList(items) {
            accessList.innerHTML = '';
            if (!items.length) { accessList.innerHTML = '<div class="list-group-item text-muted">Нет выданных доступов</div>'; return; }
            items.forEach(it => {
                const email = it.email || it.username || it.user_id;
                const row = document.createElement('div');
                row.className = 'list-group-item d-flex justify-content-between align-items-center';
                row.innerHTML = `<div><div class="fw-semibold">${email}</div><div class="small text-muted">${it.can_edit ? 'Редактирование' : 'Только чтение'}${it.is_owner ? ' • Владелец' : ''}</div></div>`;
                const btns = document.createElement('div');
                btns.className = 'btn-group';
                const revokeBtn = document.createElement('button');
                revokeBtn.className = 'btn btn-sm btn-outline-danger';
                revokeBtn.textContent = 'Убрать';
                revokeBtn.onclick = async () => {
                    const id = getJournalId(); if (!id) return;
                    await fetch(`/api/journals/${id}/access/${encodeURIComponent(it.user_id)}`, { method: 'DELETE' });
                    loadAccessList();
                };
                btns.appendChild(revokeBtn);
                row.appendChild(btns);
                accessList.appendChild(row);
            });
        }
        async function searchUsers(q) {
            if (!q) { searchResults.innerHTML = ''; return; }
            searchResults.innerHTML = '<div class="list-group-item text-muted">Поиск...</div>';
            try {
                const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                renderSearchResults(Array.isArray(data) ? data : []);
            } catch(_) { searchResults.innerHTML = '<div class="list-group-item text-danger">Ошибка</div>'; }
        }
        function renderSearchResults(items) {
            searchResults.innerHTML = '';
            if (!items.length) { searchResults.innerHTML = '<div class="list-group-item text-muted">Не найдено</div>'; return; }
            items.forEach(u => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'list-group-item list-group-item-action';
                btn.textContent = u.email || u.username || u.id;
                btn.onclick = async () => {
                    const id = getJournalId(); if (!id) return;
                    await fetch(`/api/journals/${id}/access`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: u.id, can_edit: false, is_owner: false }) });
                    searchInput.value = '';
                    searchResults.innerHTML = '';
                    loadAccessList();
                };
                searchResults.appendChild(btn);
            });
        }

        // Не даём кнопке воровать фокус у редактора (курсор сохраняется)
        btn.addEventListener('mousedown', (e) => e.preventDefault());

        // Загрузка данных при открытии модалки (bootstrap событие)
        modalEl.addEventListener('show.bs.modal', async () => {
            await loadPrivacy();
            await loadAccessList();
        });
        privacySwitch.addEventListener('change', (e) => savePrivacy(e.target.checked));
        searchBtn.addEventListener('click', () => searchUsers(searchInput.value.trim()));
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchUsers(searchInput.value.trim()); });
    })();
    </script>
