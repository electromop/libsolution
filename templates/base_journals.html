{# base.html #}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title is defined else "Журнал" }}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/journal.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            {% include "sidebar/sidebar_journals.html" %}
            {% block main %}{% endblock %}
        </div>
    </div>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <!-- <script src="/static/scripts/journals/journal.js"></script> -->
    <!-- <script src="/static/scripts/journals/blocks.js"></script> -->
    <script src="/static/scripts/browsing/browsing.js"></script>
    <script src="/static/scripts/search/init.js"></script>

    <script src="/static/scripts/journals/editor.js"></script>
    <script src="/static/scripts/journals/userlist.js"></script>
    <script src="/static/scripts/journals/cursor.js"></script>
    <script src="/static/scripts/journals/ws.js"></script>
    <script src="/static/scripts/journals/debounce.js"></script>
    <script src="/static/scripts/journals/tagmanager.js"></script>
    <script defer src="/static/scripts/journals/mini-excel.js"></script>
    <script defer src="/static/scripts/journals/main.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
