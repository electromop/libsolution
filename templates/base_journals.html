{# base.html #}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title is defined else "Журнал" }}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/journal.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            {% include "sidebar/sidebar_journals.html" %}
            {% block main %}{% endblock %}
        </div>
    </div>
    <!-- Modal: Access Settings (глобально под body) -->
    <div class="modal fade" id="journalAccessModal" tabindex="-1" aria-labelledby="journalAccessLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="journalAccessLabel">Доступ к журналу</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="privacySwitch">
                        <label class="form-check-label" for="privacySwitch">Приватный журнал</label>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Выдать доступ пользователю</label>
                        <div class="input-group">
                            <input type="text" id="userSearchInput" class="form-control" placeholder="Почта или имя пользователя">
                            <button class="btn btn-outline-secondary" id="userSearchBtn"><i class="bi bi-search"></i></button>
                        </div>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" role="switch" id="grantCanEdit">
                            <label class="form-check-label" for="grantCanEdit">Назначить редактором</label>
                        </div>
                        <div id="userSearchResults" class="list-group mt-2" style="max-height: 200px; overflow:auto;"></div>
                    </div>
                    <div class="mt-3">
                        <div class="d-flex align-items-center mb-2">
                            <span class="fw-semibold">Пользователи с доступом</span>
                        </div>
                        <div id="accessList" class="list-group"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <!-- <script src="/static/scripts/journals/journal.js"></script> -->
    <!-- <script src="/static/scripts/journals/blocks.js"></script> -->
    <script src="/static/scripts/browsing/browsing.js"></script>
    <script src="/static/scripts/search/init.js"></script>

    <script src="/static/scripts/journals/block_editor.js"></script>
    <script src="/static/scripts/journals/multi_block_selection.js"></script>
    <script src="/static/scripts/journals/userlist.js"></script>
    <!-- <script src="/static/scripts/journals/cursor.js"></script> -->
    <script src="/static/scripts/journals/ws_blocks.js"></script>
    <script src="/static/scripts/journals/debounce.js"></script>
    <script src="/static/scripts/journals/tagmanager.js"></script>
    <script src="/static/scripts/journals/timeline.js"></script>
    <script defer src="/static/scripts/journals/mini-excel.js"></script>
    <script defer src="/static/scripts/journals/main.js"></script>
    <script>
    (function() {
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('access-settings-btn');
            const modalEl = document.getElementById('journalAccessModal');
            if (!btn || !modalEl) return;
            const privacySwitch = document.getElementById('privacySwitch');
            const searchInput = document.getElementById('userSearchInput');
            const searchBtn = document.getElementById('userSearchBtn');
            const searchResults = document.getElementById('userSearchResults');
            const accessList = document.getElementById('accessList');
            const grantCanEdit = document.getElementById('grantCanEdit');

            function getJournalId() {
                const m = window.location.pathname.match(/\/journal\/(\d+)/); return m ? m[1] : null;
            }
            async function loadPrivacy() {
                const id = getJournalId(); if (!id) return;
                try {
                    const res = await fetch(`/api/journals/${id}/privacy`);
                    if (!res.ok) return;
                    const data = await res.json();
                    privacySwitch.checked = !!data.is_private;
                } catch(_) {}
            }
            async function savePrivacy(val) {
                const id = getJournalId(); if (!id) return;
                try {
                    await fetch(`/api/journals/${id}/privacy`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ is_private: !!val }) });
                } catch(_) {}
            }
            async function loadAccessList() {
                const id = getJournalId(); if (!id) return;
                try {
                    const res = await fetch(`/api/journals/${id}/access`);
                    const data = await res.json();
                    renderAccessList(Array.isArray(data) ? data : []);
                } catch(_) { renderAccessList([]); }
            }
            function renderAccessList(items) {
                accessList.innerHTML = '';
                if (!items.length) { accessList.innerHTML = '<div class="list-group-item text-muted">Нет выданных доступов</div>'; return; }
                items.forEach(it => {
                    const email = it.email || it.username || it.user_id;
                    const row = document.createElement('div');
                    row.className = 'list-group-item d-flex justify-content-between align-items-center';
                    row.innerHTML = `<div><div class=\"fw-semibold\">${email}</div><div class=\"small text-muted\">${it.is_owner ? 'Владелец' : (it.can_edit ? 'Редактор' : 'Только чтение')}</div></div>`;
                    const btns = document.createElement('div');
                    btns.className = 'd-flex align-items-center';
                    // Тоггл редактирования
                    const editWrap = document.createElement('div');
                    editWrap.className = 'form-check form-switch me-2';
                    const editInput = document.createElement('input');
                    editInput.className = 'form-check-input';
                    editInput.type = 'checkbox';
                    editInput.role = 'switch';
                    editInput.checked = !!it.can_edit;
                    editInput.title = 'Разрешить редактирование';
                    if (it.is_owner) {
                        editInput.disabled = true;
                    }
                    editInput.addEventListener('change', async () => {
                        const id = getJournalId(); if (!id) return;
                        await fetch(`/api/journals/${id}/access`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: it.user_id, can_edit: !!editInput.checked, is_owner: !!it.is_owner }) });
                        loadAccessList();
                    });
                    editWrap.appendChild(editInput);
                    btns.appendChild(editWrap);
                    const revokeBtn = document.createElement('button');
                    revokeBtn.className = 'btn btn-sm btn-outline-danger';
                    revokeBtn.textContent = 'Убрать';
                    revokeBtn.onclick = async () => {
                        const id = getJournalId(); if (!id) return;
                        await fetch(`/api/journals/${id}/access/${encodeURIComponent(it.user_id)}`, { method: 'DELETE' });
                        loadAccessList();
                    };
                    btns.appendChild(revokeBtn);
                    row.appendChild(btns);
                    accessList.appendChild(row);
                });
            }
            async function searchUsers(q) {
                if (!q) { searchResults.innerHTML = ''; return; }
                searchResults.innerHTML = '<div class="list-group-item text-muted">Поиск...</div>';
                try {
                    const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`);
                    const data = await res.json();
                    renderSearchResults(Array.isArray(data) ? data : []);
                } catch(_) { searchResults.innerHTML = '<div class="list-group-item text-danger">Ошибка</div>'; }
            }
            function renderSearchResults(items) {
                searchResults.innerHTML = '';
                if (!items.length) { searchResults.innerHTML = '<div class="list-group-item text-muted">Не найдено</div>'; return; }
                items.forEach(u => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'list-group-item list-group-item-action';
                    btn.textContent = u.email || u.username || u.id;
                    btn.onclick = async () => {
                        const id = getJournalId(); if (!id) return;
                        const canEdit = !!(grantCanEdit && grantCanEdit.checked);
                        await fetch(`/api/journals/${id}/access`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: u.id, can_edit: canEdit, is_owner: false }) });
                        searchInput.value = '';
                        searchResults.innerHTML = '';
                        loadAccessList();
                    };
                    searchResults.appendChild(btn);
                });
            }

            // Не даём кнопке воровать фокус у редактора
            btn.addEventListener('mousedown', (e) => e.preventDefault());

            // Загрузка данных при открытии модалки (bootstrap событие)
            modalEl.addEventListener('show.bs.modal', async () => {
                await loadPrivacy();
                await loadAccessList();
            });
            privacySwitch.addEventListener('change', (e) => savePrivacy(e.target.checked));
            searchBtn.addEventListener('click', () => searchUsers(searchInput.value.trim()));
            searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchUsers(searchInput.value.trim()); });
        });
    })();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
