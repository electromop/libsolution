<html lang="ru"><head>
    <meta charset="UTF-8">
    <title>Редактор изображений</title>
    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
    <style>
      body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; margin: 0; }
      .modal {
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1000;
      }
      .modal-content {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-width: 100vw;
        max-height: 100vh;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #canvas-container { 
        border: 2px solid #ddd; 
        margin-top: 10px; 
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fff;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .button-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        width: 100%;
        max-width: 800px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #ddd;
      }
      input[type="file"] {
        margin-bottom: 20px;
      }
      .toggle-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 150px;
        background-color: #ddd;
        border-radius: 20px;
        cursor: pointer;
        position: relative;
      }
      .toggle-button div {
        width: 50%;
        padding: 10px;
        text-align: center;
        border-radius: 20px;
        transition: background-color 0.3s;
      }
      .toggle-button .drawing {
        background-color: #fff;
      }
      .toggle-button .moving {
        background-color: transparent;
      }
      #canvas {
        display: block;
        max-width: 100vw;
        max-height: 80vh;
        width: 100%;
        height: 100%;
        background: #fff;
      }
    </style>
  <style class="automa-element-selector">@font-face { font-family: "Inter var"; font-weight: 100 900; font-display: swap; font-style: normal; font-named-instance: "Regular"; src: url("chrome-extension://infppggnoaenmfagbfknfkancpbljcca/Inter-roman-latin.var.woff2") format("woff2") }
  .automa-element-selector { direction: ltr } 
   [automa-isDragging] { user-select: none } 
   [automa-el-list] {outline: 2px dashed #6366f1;}</style></head>
  <body>
  
  <div class="modal">
    <div class="modal-content">
      <h2>Редактор изображений</h2>
  
      <input type="file" id="imageUpload" accept="image/*">
      <div id="canvas-container">
        <canvas id="canvas"></canvas>
      </div>
  
      <div class="button-container">
        <div class="toggle-button" onclick="toggleMode()">
          <div class="drawing" style="background-color: transparent;">✏️ Рисование</div>
          <div class="moving" style="background-color: rgb(255, 255, 255);">🖱️ Перемещение</div>
        </div>
        <button onclick="addText()">🔤 Добавить текст</button>
        <button onclick="saveImage()">💾 Сохранить</button>
      </div>
    </div>
  </div>
  
  <script>
    // Получаем максимально возможные размеры для канваса (вьюпорт минус отступы)
    function getMaxCanvasSize() {
      // 80vh для высоты, чтобы кнопки и заголовок влезли
      const maxWidth = window.innerWidth;
      const maxHeight = window.innerHeight * 0.8;
      return { width: maxWidth, height: maxHeight };
    }
  
    let canvas = new fabric.Canvas('canvas', { selection: true, preserveObjectStacking: true });
    // По умолчанию режим перемещения/выделения (не рисование), чтобы можно было ресайзить картинку
    canvas.isDrawingMode = false;
    canvas.hoverCursor = 'move';
    canvas.defaultCursor = 'default';
    canvas.skipTargetFind = false;
    // На случай зафиксированного курсора из инлайновых стилей – позволим Fabric управлять курсором
    try {
      if (canvas.upperCanvasEl && canvas.upperCanvasEl.style.removeProperty) {
        canvas.upperCanvasEl.style.removeProperty('cursor');
      }
      if (canvas.lowerCanvasEl && canvas.lowerCanvasEl.style.removeProperty) {
        canvas.lowerCanvasEl.style.removeProperty('cursor');
      }
    } catch(_) {}
  
    function updateModeUI() {
      const drawingDiv = document.querySelector('.toggle-button .drawing');
      const movingDiv = document.querySelector('.toggle-button .moving');
      if (!drawingDiv || !movingDiv) return;
      if (canvas.isDrawingMode) {
        drawingDiv.style.backgroundColor = '#fff';
        movingDiv.style.backgroundColor = 'transparent';
        canvas.hoverCursor = 'crosshair';
      } else {
        drawingDiv.style.backgroundColor = 'transparent';
        movingDiv.style.backgroundColor = '#fff';
        canvas.hoverCursor = 'move';
      }
      try { if (canvas.upperCanvasEl) canvas.upperCanvasEl.style.cursor = canvas.hoverCursor; } catch(_) {}
    }

    function toggleMode() {
      canvas.isDrawingMode = !canvas.isDrawingMode;
      updateModeUI();
    }
  
    function addText() {
      const text = new fabric.IText('Надпись', {
        left: 50,
        top: 50,
        fontSize: 20,
        fill: '#000'
      });
      canvas.add(text);
    }
  
    function saveImage() {
      const dataURL = canvas.toDataURL({
        format: 'png',
        multiplier: 2
      });
  
      const link = document.createElement('a');
      link.href = dataURL;
      link.download = 'annotated.png';
      link.click();
    }
  
    // Храним оригинальные размеры картинки для ресайза
    let originalImageData = null;
  
    document.getElementById('imageUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
  
      const reader = new FileReader();
      reader.onload = function(event) {
        const imgObj = new Image();
        imgObj.onload = function () {
          // Сохраняем оригинальные размеры и src
          originalImageData = {
            width: imgObj.width,
            height: imgObj.height,
            src: event.target.result
          };
  
          setCanvasAndBackgroundImage();
        };
        imgObj.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  
    function setCanvasAndBackgroundImage() {
      if (!originalImageData) return;
      const { width: maxWidth, height: maxHeight } = getMaxCanvasSize();
      const imgWidth = originalImageData.width;
      const imgHeight = originalImageData.height;
  
      // Если картинка меньше экрана — используем её реальный размер
      // Если больше — уменьшаем до максимального размера, сохраняя пропорции
      let displayWidth = imgWidth;
      let displayHeight = imgHeight;
      let scale = 1;
  
      if (imgWidth > maxWidth || imgHeight > maxHeight) {
        scale = Math.min(maxWidth / imgWidth, maxHeight / imgHeight, 1);
        displayWidth = imgWidth * scale;
        displayHeight = imgHeight * scale;
      }
  
      // Устанавливаем размеры канваса
      canvas.setWidth(displayWidth);
      canvas.setHeight(displayHeight);
  
      // Устанавливаем размеры самого canvas DOM-элемента
      const canvasEl = document.getElementById('canvas');
      canvasEl.width = displayWidth;
      canvasEl.height = displayHeight;
      canvasEl.style.width = displayWidth + 'px';
      canvasEl.style.height = displayHeight + 'px';
  
      // Очищаем все объекты и фон
      canvas.clear();
  
      // Добавляем изображение как объект на канвас с возможностью ресайза
      fabric.Image.fromURL(originalImageData.src, function(fabricImage) {
        // Начальный масштаб: 70% ширины доступной области
        const imageScaleX = scale * 0.7;
        const imageScaleY = imageScaleX;
        fabricImage.set({
          left: 0,
          top: 0,
          scaleX: imageScaleX,
          scaleY: imageScaleY,
          selectable: true,
          evented: true,
          lockRotation: true,
          lockScalingFlip: true,
          hasBorders: true,
          hasControls: true,
          transparentCorners: false,
          cornerStyle: 'rect',
          cornerColor: '#3b82f6',
          cornerStrokeColor: '#ffffff',
          cornerStrokeWidth: 2,
          borderColor: '#3b82f6',
          borderScaleFactor: 2,
          cornerSize: 14
        });
        // Скрыть контроль вращения, оставить только ручки изменения размера
        if (fabricImage.setControlsVisibility) {
          fabricImage.setControlsVisibility({
            mtr: false,
            tl: false, tr: false, bl: false, br: false,
            mt: false, mb: false,
            ml: false, mr: false
          });
        }

        // Кастомный рендер боковых ручек: короткие синие полоски внутри изображения
        const renderBlueSideBar = function(ctx, left, top, styleOverride, fabricObject, control) {
          ctx.save();
          // смещение внутрь изображения, чтобы ручка была внутри, а не снаружи
          const inset = 6; // px внутрь
          const w = 6;     // толщина полоски
          const h = 28;    // длина полоски
          // Сместим центр полоски внутрь объекта
          if (control === fabricObject.controls.ml) {
            left += inset;
          } else if (control === fabricObject.controls.mr) {
            left -= inset;
          }
          ctx.translate(left, top);
          ctx.fillStyle = '#3b82f6';
          const r = 3; // радиус скругления
          const x = -w / 2;
          const y = -h / 2;
          const width = w;
          const height = h;
          // Отрисовка скругленного прямоугольника
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + width - r, y);
          ctx.quadraticCurveTo(x + width, y, x + width, y + r);
          ctx.lineTo(x + width, y + height - r);
          ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
          ctx.lineTo(x + r, y + height);
          ctx.quadraticCurveTo(x, y + height, x, y + height - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        };

        // Настроим только боковые контролы с горизонтальным ресайзом
        fabricImage.controls.ml = new fabric.Control({
          x: -0.5, y: 0,
          cursorStyle: 'ew-resize',
          actionHandler: fabric.controlsUtils.scalingX,
          render: renderBlueSideBar,
          // увеличить зону тапа, полоска останется узкой, но хитбокс шире
          sizeX: 28, sizeY: 48
        });
        fabricImage.controls.mr = new fabric.Control({
          x: 0.5, y: 0,
          cursorStyle: 'ew-resize',
          actionHandler: fabric.controlsUtils.scalingX,
          render: renderBlueSideBar,
          sizeX: 28, sizeY: 48
        });

        canvas.add(fabricImage);
        // Центрируем изображение внутри канваса
        try {
          const imgW = fabricImage.getScaledWidth();
          const imgH = fabricImage.getScaledHeight();
          const cnvW = canvas.getWidth();
          const cnvH = canvas.getHeight();
          fabricImage.set({
            left: Math.max(0, (cnvW - imgW) / 2),
            top: Math.max(0, (cnvH - imgH) / 2)
          });
        } catch(_) {}
        canvas.sendToBack(fabricImage);
        canvas.setActiveObject(fabricImage);
        canvas.requestRenderAll();

        // Появление ручек по наведению с задержкой скрытия
        (function attachHoverHandles(img){
          let hideTimer = null;
          const show = () => {
            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            // Активируем объект, чтобы Fabric отрисовал контролы
            try { canvas.setActiveObject(img); } catch(_) {}
            if (img.setControlsVisibility) img.setControlsVisibility({ ml: true, mr: true });
            canvas.requestRenderAll();
          };
          const scheduleHide = () => {
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
              if (img.setControlsVisibility) img.setControlsVisibility({ ml: false, mr: false });
              canvas.requestRenderAll();
            }, 200);
          };
          canvas.on('mouse:over', function(e){ if (e && e.target === img) show(); });
          canvas.on('mouse:out', function(e){ if (e && e.target === img) scheduleHide(); });
          img.on('selected', show);
          img.on('deselected', scheduleHide);
          // Во время изменения масштаба – ручки остаются у краёв (Fabric сам рассчитывает), сохраняем масштаб после завершения
          img.on('scaling', () => { if (img.setControlsVisibility) img.setControlsVisibility({ ml: true, mr: true }); });
          img.on('modified', () => {});
        })(fabricImage);
      }, { crossOrigin: 'anonymous' });
    }
  
    // При изменении размера окна — если есть картинка, пересчитать размеры канваса и фоновой картинки
    window.addEventListener('resize', function() {
      if (originalImageData) {
        setCanvasAndBackgroundImage();
      }
    });

    // Всегда выбирать объекты по клику (на случай если активность сбросилась)
    canvas.on('mouse:down', function(e) {
      if (!canvas.isDrawingMode && e && e.target) {
        canvas.setActiveObject(e.target);
        canvas.requestRenderAll();
      }
    });

    // Инициализировать UI состояния режима после создания canvas
    updateModeUI();
  </script>
